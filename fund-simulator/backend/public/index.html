<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基金模拟交易系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .profit {
            color: #28a745;
            font-weight: bold;
        }
        .loss {
            color: #dc3545;
            font-weight: bold;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #5a6fd6 0%, #6a4199 100%);
        }
        .table th {
            background-color: #f8f9fa;
            font-weight: 600;
        }
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
        .nav-pills .nav-link.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-graph-up"></i> 基金模拟交易系统
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#dashboard">仪表盘</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#portfolio">投资组合</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#trading">交易</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#analysis">分析</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- 仪表盘 -->
        <section id="dashboard">
            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="card stat-card">
                        <div class="card-body">
                            <h6 class="card-title">总资产</h6>
                            <h3 class="mb-0" id="totalAssets">¥100,000.00</h3>
                            <small>初始资金</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card">
                        <div class="card-body">
                            <h6 class="card-title">今日收益</h6>
                            <h3 class="mb-0" id="dailyReturn">+¥1,250.00</h3>
                            <small>+1.25%</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card">
                        <div class="card-body">
                            <h6 class="card-title">累计收益</h6>
                            <h3 class="mb-0" id="totalReturn">+¥15,680.00</h3>
                            <small>+15.68%</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card">
                        <div class="card-body">
                            <h6 class="card-title">持仓数量</h6>
                            <h3 class="mb-0" id="holdingCount">5</h3>
                            <small>只基金</small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">资产走势</h5>
                        </div>
                        <div class="card-body">
                            <div class="chart-container">
                                <canvas id="assetChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">资产配置</h5>
                        </div>
                        <div class="card-body">
                            <div class="chart-container">
                                <canvas id="allocationChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 投资组合 -->
        <section id="portfolio" class="mt-4">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">我的持仓</h5>
                    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addFundModal">
                        <i class="bi bi-plus"></i> 添加基金
                    </button>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>基金代码</th>
                                    <th>基金名称</th>
                                    <th>持仓份额</th>
                                    <th>成本价</th>
                                    <th>现价</th>
                                    <th>市值</th>
                                    <th>盈亏</th>
                                    <th>收益率</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="holdingsTable">
                                <!-- 动态加载 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <!-- 交易 -->
        <section id="trading" class="mt-4">
            <div class="row">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">买入基金</h5>
                        </div>
                        <div class="card-body">
                            <form id="buyForm">
                                <div class="mb-3">
                                    <label for="fundCode" class="form-label">基金代码</label>
                                    <input type="text" class="form-control" id="fundCode" placeholder="请输入基金代码" required>
                                </div>
                                <div class="mb-3">
                                    <label for="buyAmount" class="form-label">买入金额</label>
                                    <div class="input-group">
                                        <span class="input-group-text">¥</span>
                                        <input type="number" class="form-control" id="buyAmount" placeholder="请输入买入金额" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="buyDate" class="form-label">交易日期</label>
                                    <input type="date" class="form-control" id="buyDate">
                                </div>
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="bi bi-cart-plus"></i> 确认买入
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">卖出基金</h5>
                        </div>
                        <div class="card-body">
                            <form id="sellForm">
                                <div class="mb-3">
                                    <label for="sellFundCode" class="form-label">基金代码</label>
                                    <select class="form-select" id="sellFundCode">
                                        <option value="">请选择持仓基金</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="sellShares" class="form-label">卖出份额</label>
                                    <input type="number" class="form-control" id="sellShares" placeholder="请输入卖出份额" required>
                                </div>
                                <div class="mb-3">
                                    <label for="sellDate" class="form-label">交易日期</label>
                                    <input type="date" class="form-control" id="sellDate">
                                </div>
                                <button type="submit" class="btn btn-danger w-100">
                                    <i class="bi bi-cart-dash"></i> 确认卖出
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 分析 -->
        <section id="analysis" class="mt-4">
            <div class="card">
                <div class="card-header">
                    <ul class="nav nav-pills card-header-pills">
                        <li class="nav-item">
                            <a class="nav-link active" href="#performance">收益分析</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#risk">风险指标</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#history">交易历史</a>
                        </li>
                    </ul>
                </div>
                <div class="card-body">
                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="performance">
                            <div class="chart-container">
                                <canvas id="performanceChart"></canvas>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="risk">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="card">
                                        <div class="card-body">
                                            <h6>风险指标</h6>
                                            <div id="riskMetrics">
                                                <!-- 动态加载 -->
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="card">
                                        <div class="card-body">
                                            <h6>风险收益散点图</h6>
                                            <div class="chart-container">
                                                <canvas id="riskReturnChart"></canvas>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="history">
                            <div class="table-responsive">
                                <table class="table table-striped">
                                    <thead>
                                        <tr>
                                            <th>日期</th>
                                            <th>基金</th>
                                            <th>类型</th>
                                            <th>金额</th>
                                            <th>份额</th>
                                            <th>手续费</th>
                                        </tr>
                                    </thead>
                                    <tbody id="transactionHistory">
                                        <!-- 动态加载 -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- 添加基金模态框 -->
    <div class="modal fade" id="addFundModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">添加基金到自选</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addFundForm">
                        <div class="mb-3">
                            <label for="newFundCode" class="form-label">基金代码</label>
                            <input type="text" class="form-control" id="newFundCode" required>
                        </div>
                        <div class="mb-3">
                            <label for="newFundName" class="form-label">基金名称</label>
                            <input type="text" class="form-control" id="newFundName" required>
                        </div>
                        <button type="submit" class="btn btn-primary">添加</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 消息提示 -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="liveToast" class="toast hide" role="alert">
            <div class="toast-header">
                <strong class="me-auto">系统提示</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastMessage">
                操作成功
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
